services:
  assist:
    build: .
    init: true
    env_file: .env
    # No published ports: reachable only via the tunnel (login trusts CF-Connecting-IP).
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN fehlt in .env}
    depends_on:
      - assist
    restart: unless-stopped
